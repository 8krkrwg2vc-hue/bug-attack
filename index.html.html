<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bug Attack 1.4.1 — Spawn Fix</title><style>body{margin:0;background:#101d26;color:#f4f7f7;font-family:system-ui,sans-serif;padding:14px}main{max-width:460px;margin:auto}h1{text-align:center;font-size:25px;margin:5px 0 12px}.hud{display:flex;justify-content:space-between;font-weight:850;margin:8px 0;font-size:14px}.track{height:9px;background:#44585a;border-radius:10px;overflow:hidden;margin-bottom:10px}#progress{background:#66d6a1;width:0;height:100%}.field{position:relative;border-radius:14px;overflow:hidden}canvas{width:100%;display:block;touch-action:none;background:#42683b}.overlay{position:absolute;inset:0;background:#10212be9;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:16px;gap:10px}.overlay h2{font-size:28px;margin:0}.overlay .emoji{font-size:48px;animation:pop .5s ease-out}.overlay p{line-height:1.6;margin:0}.overlay small{color:#ffe17e;font-weight:bold;letter-spacing:1px}@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}button{cursor:pointer;border-radius:10px;padding:12px 17px;font-weight:800;font-size:15px}.primary{background:#ffda66;color:#26321c;border:0}.controls{display:flex;justify-content:center;gap:8px;margin:12px 0;flex-wrap:wrap}.controls button{background:#20353f;color:white;border:1px solid #82969a}button:disabled{opacity:.45}#status,.legend{text-align:center;font-size:13px;color:#c5d6d8;margin:9px 0}.legend{font-size:12px}</style></head><body><main><h1>🐞 BUG ATTACK 🎯</h1><div class="hud"><span id="level">LEVEL 1</span><span id="score">⭐ 0</span><span id="lives">❤️❤️❤️</span></div><div class="track"><div id="progress"></div></div><div class="field"><canvas id="field" width="360" height="440" aria-label="Tap bugs before they escape"></canvas><div id="overlay" class="overlay"><div id="emoji" class="emoji">🐞 🎯 🪲</div><h2 id="title">BUG ATTACK!</h2><small id="subtitle">TARGET ZONES EDITION</small><p id="message">New scenery every level!<br>Bullseyes unlock at Level 3.<br>Squish 15 bugs to advance.</p><button class="primary" id="start">▶ START GAME</button></div></div><div class="controls"><button id="pause" disabled>Pause</button><button id="restart">Restart</button><button id="sound">🔊 Sound on</button></div><div id="status">Squish 15 bugs to clear a level!</div><div class="legend">🎯 Center +50 · Middle +30 · Outer +20 · Elsewhere +10</div></main><script>
(()=>{const $=id=>document.getElementById(id),canvas=$('field'),ctx=canvas.getContext('2d'),W=360,H=440;const holes=[{x:180,y:220},{x:88,y:128},{x:277,y:312},{x:278,y:115},{x:85,y:328},{x:180,y:370}];const themes=[{name:'Garden Patrol',base:'#456c40',detail:'#63834c',edge:'#b3d28c',symbol:'🌿'},{name:'Desert Dash',base:'#bc965e',detail:'#d5b17b',edge:'#f4d59a',symbol:'🏜️'},{name:'Neon Night',base:'#182e51',detail:'#284a75',edge:'#6de9fa',symbol:'🌃'},{name:'Lava Lab',base:'#543341',detail:'#864754',edge:'#ffab67',symbol:'🌋'},{name:'Frozen Field',base:'#8bb7c8',detail:'#b9d9e5',edge:'#eaf9ff',symbol:'❄️'},{name:'Space Swarm',base:'#252647',detail:'#40406c',edge:'#b3a4ff',symbol:'🚀'}];let bugs=[],bursts=[],score=0,lives=3,level=1,kills=0,spawn=0,playing=false,paused=false,mode='intro',raf=0,last=0,nextLife=250,sound=true,audio=null,targets=[];const theme=()=>themes[(level-1)%themes.length];function tone(f,d=.13,type='square',vol=.045,slide=1){if(!sound)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;if(!audio)audio=new A();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+d+.01)}catch(e){}}function melody(type){if(type==='splat'){tone(210,.1,'sawtooth',.06,.35);tone(85,.1,'triangle',.05,.5)}if(type==='miss')tone(160,.2,'square',.04,.5);if(type==='win')[[523,0],[659,120],[784,240],[1047,380],[1318,550]].forEach(([f,t])=>setTimeout(()=>tone(f,.2,'triangle',.065),t));if(type==='life')[[660,0],[880,110],[1100,220]].forEach(([f,t])=>setTimeout(()=>tone(f,.16,'triangle',.05),t))}function update(){$('level').textContent=theme().symbol+' LEVEL '+level;$('score').textContent='⭐ '+score;$('lives').textContent='❤️'.repeat(Math.max(0,lives));$('progress').style.width=(kills/15*100)+'%'}function setupTargets(){targets=[];if(level<3)return;const candidates=[{x:177,y:100},{x:91,y:270},{x:270,y:255},{x:184,y:348},{x:280,y:85}];for(let i=0;i<Math.min(3,level-2);i++)targets.push(candidates[(i+level-3)%candidates.length])}function drawBackground(){const t=theme();ctx.fillStyle=t.base;ctx.fillRect(0,0,W,H);ctx.fillStyle=t.detail;for(let i=0;i<100;i++){const x=(i*89+17)%W,y=(i*131+37)%H;if(level%6===3||level%6===0){ctx.beginPath();ctx.arc(x,y,1.5+(i%3),0,Math.PI*2);ctx.fill()}else if(level%6===4)ctx.fillRect(x,y,5+(i%3)*3,2);else ctx.fillRect(x,y,3,7)}ctx.globalAlpha=.17;ctx.strokeStyle=t.edge;ctx.lineWidth=2;for(let i=0;i<5;i++){ctx.beginPath();ctx.arc(180,220,75+i*52,0,Math.PI*2);ctx.stroke()}ctx.globalAlpha=1;for(const target of targets){ctx.save();ctx.globalAlpha=.76;[{r:64,c:'#f0c76c',w:5},{r:44,c:'#f6ebbe',w:5},{r:24,c:'#ffd96a',w:5}].forEach(r=>{ctx.strokeStyle=r.c;ctx.lineWidth=r.w;ctx.beginPath();ctx.arc(target.x,target.y,r.r,0,Math.PI*2);ctx.stroke()});ctx.fillStyle='#fff1aa';ctx.beginPath();ctx.arc(target.x,target.y,7,0,Math.PI*2);ctx.fill();ctx.restore()}holes.slice(0,Math.min(level,6)).forEach(h=>{ctx.fillStyle='#192820';ctx.beginPath();ctx.ellipse(h.x,h.y,25,13,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle=t.edge;ctx.lineWidth=4;ctx.stroke()});ctx.strokeStyle=t.edge;ctx.lineWidth=5;ctx.strokeRect(2,2,W-4,H-4)}function draw(){drawBackground();for(const b of bugs){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.angle+Math.PI/2);ctx.strokeStyle='#101a15';ctx.lineWidth=2.5;for(const s of [-1,1])for(const k of [-1,0,1]){ctx.beginPath();ctx.moveTo(s*6,k*5);ctx.lineTo(s*16,k*8+3);ctx.stroke()}ctx.fillStyle='#101a15';ctx.beginPath();ctx.ellipse(0,0,11,14,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=b.color;ctx.beginPath();ctx.ellipse(0,0,8,11,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#1a2118';ctx.beginPath();ctx.moveTo(0,-11);ctx.lineTo(0,11);ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-3,-8,2,0,Math.PI*2);ctx.arc(3,-8,2,0,Math.PI*2);ctx.fill();ctx.restore()}for(const p of bursts){ctx.save();ctx.globalAlpha=Math.min(1,p.life/.45);ctx.textAlign='center';ctx.font='900 22px system-ui';ctx.lineWidth=3;ctx.strokeStyle='#132322';ctx.strokeText('+'+p.points,p.x,p.y);ctx.fillStyle=p.points>=50?'#ffe16a':'#fff';ctx.fillText('+'+p.points,p.x,p.y);ctx.restore()}}function addBug(){const h=holes[Math.floor(Math.random()*Math.min(level,6))],a=Math.random()*Math.PI*2;bugs.push({x:h.x,y:h.y,vx:Math.cos(a),vy:Math.sin(a),angle:a,speed:78+(level-1)*5,color:['#f07a49','#e4d05d','#92aff5'][Math.floor(Math.random()*3)]})}function show(title,sub,msg,emoji,button){$('title').textContent=title;$('subtitle').textContent=sub;$('message').innerHTML=msg;$('emoji').textContent=emoji;$('start').textContent=button;$('emoji').style.animation='none';void $('emoji').offsetWidth;$('emoji').style.animation='pop .5s ease-out';$('overlay').style.display='flex'}function finish(){playing=false;clearInterval(raf);mode='over';$('pause').disabled=true;show('GAME OVER','FINAL RESULTS','Score: <b>'+score+'</b><br>Level reached: '+level,'💥 🪲 💥','▶ PLAY AGAIN')}function clearLevel(){playing=false;clearInterval(raf);mode='clear';score+=100;update();melody('win');$('pause').disabled=true;show('LEVEL '+level+' CLEARED!','🏆 +100 LEVEL BONUS','Score: <b>'+score+'</b><br>Next destination: <b>'+themes[level%themes.length].name+'</b><br>'+(level===2?'🎯 Bullseye scoring unlocked!':'15 more bugs await!'),'🏆 🎉 ⭐','▶ NEXT LEVEL');$('status').textContent='Level complete! +100 bonus'}function tick(now){if(!playing||paused)return;const dt=Math.min((now-last)/1000,.06);last=now;spawn+=dt;const interval=Math.max(.53,1.15-(level-1)*.055);if(spawn>=interval){spawn=0;addBug();if(level>=5&&Math.random()<Math.min(.3,(level-4)*.045))addBug()}bugs=bugs.filter(b=>{b.x+=b.vx*b.speed*dt;b.y+=b.vy*b.speed*dt;if(b.x<-16||b.x>W+16||b.y<-16||b.y>H+16){lives--;melody('miss');return false}return true});bursts=bursts.filter(p=>{p.life-=dt;p.y-=25*dt;return p.life>0});update();draw();if(lives<=0){finish();return}}function begin(){playing=true;paused=false;spawn=0;bugs=[];bursts=[];setupTargets();addBug();$('overlay').style.display='none';$('pause').disabled=false;$('pause').textContent='Pause';$('status').textContent=theme().name+' — '+(15-kills)+' bugs remaining';last=performance.now();draw();raf=setInterval(()=>tick(performance.now()),33)}function newGame(){clearInterval(raf);score=0;lives=3;level=1;kills=0;nextLife=250;mode='play';update();tone(520,.1);begin()}function advance(){level++;kills=0;mode='play';update();begin()}function pointsFor(x,y){if(level<3)return 10;let nearest=Infinity;for(const t of targets)nearest=Math.min(nearest,Math.hypot(x-t.x,y-t.y));return nearest<=24?50:nearest<=44?30:nearest<=64?20:10}canvas.addEventListener('pointerdown',e=>{if(!playing||paused)return;e.preventDefault();const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;for(let i=bugs.length-1;i>=0;i--){const b=bugs[i];if(Math.hypot(x-b.x,y-b.y)>26)continue;bugs.splice(i,1);const points=pointsFor(b.x,b.y);score+=points;kills++;bursts.push({x:b.x,y:b.y,life:.6,points});melody('splat');while(score>=nextLife){lives=Math.min(5,lives+1);nextLife+=250;melody('life');$('status').textContent='❤️ BONUS LIFE!'}update();draw();if(kills>=15)clearLevel();else $('status').textContent=theme().name+' — '+(15-kills)+' bugs to go';break}});$('start').addEventListener('click',()=>{if(mode==='clear')advance();else newGame()});$('restart').addEventListener('click',newGame);$('pause').addEventListener('click',()=>{if(!playing)return;paused=!paused;$('pause').textContent=paused?'Resume':'Pause';$('status').textContent=paused?'Paused':'Keep squishing!';if(paused)clearInterval(raf);else{last=performance.now();raf=setInterval(()=>tick(performance.now()),33)}});$('sound').addEventListener('click',()=>{sound=!sound;$('sound').textContent=sound?'🔊 Sound on':'🔇 Sound off';if(sound)tone(660,.12)});document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing&&!paused){paused=true;clearInterval(raf);$('pause').textContent='Resume';$('status').textContent='Paused'}});setupTargets();update();draw()})();
</script></body></html>
